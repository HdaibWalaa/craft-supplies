<!doctype html>
<html lang="en" dir="ltr" data-theme="theme_1">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Establish the writing direction before the browser performs its first
      // layout. A deferred module is too late for RTL viewport initialization.
      (() => {
        let storedLocale = null;
        try {
          storedLocale = localStorage.getItem("locale");
        } catch {
          // Storage may be unavailable in privacy-restricted browser contexts.
          // Arabic is the storefront default, so direction must still be set.
        }
        const locale = storedLocale === "en" ? "en" : "ar";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="application-name" content="Craft Supplies" />
    <meta property="og:site_name" content="Craft Supplies" />
    <title>Craft Supplies</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
